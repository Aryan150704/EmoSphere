<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmoSphere – Emotion Analyzer</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h2>EmoSphere – Emotion Analyzer</h2>

        <label>Select Domain:</label>
        <select id="domain">
            <option value="General">General</option>
            <option value="Social">Social</option>
            <option value="Professional">Professional</option>
        </select>

        <label>Enter Your Text:</label>
        <textarea id="userText" rows="8" placeholder="Type or paste your text here..."></textarea>

        <button id="analyzeBtn">Analyze</button>

        <p id="loading" class="loading">⏳ Analyzing… Please wait.</p>
    </div>

    <!-- External JS -->
    <script src="script.js"></script>
</body>
</html>
