<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmoSphere - Emotion Detection</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>EmoSphere</h1>
            <p class="tagline">Emotion Detection & Summarization</p>
        </header>

        <section class="input-section">
            <label>Select Domain:</label>
            <select id="domain">
                <option value="general">General</option>
                <option value="healthcare">Healthcare</option>
                <option value="legal">Legal</option>
                <option value="education">Education</option>
            </select>

            <label>Enter Text:</label>
            <textarea id="userText" rows="8" placeholder="Type your text here..."></textarea>

            <button id="analyzeBtn">Analyze</button>
        </section>

        <div id="loader" class="hidden">Analyzing... Please wait.</div>
    </div>

    <script src="/static/js/script.js"></script>
</body>
</html>
