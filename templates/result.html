<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Results - EmoSphere</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Analysis Results</h1>
        </header>

        <h2>Summary</h2>
        <p id="summary-text"></p>

        <h2>Emotion Scores</h2>
        <canvas id="emotionChart"></canvas>

        <button onclick="window.location.href='/'">← Analyze Again</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const data = JSON.parse(localStorage.getItem("emotionData"));

        document.getElementById("summary-text").textContent = data.summary;

        const ctx = document.getElementById("emotionChart");

        new Chart(ctx, {
            type: "pie",
            data: {
                labels: Object.keys(data.final),
                datasets: [{
                    data: Object.values(data.final)
                }]
            }
        });
    </script>

</body>
</html>
